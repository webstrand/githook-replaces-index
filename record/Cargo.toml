[package]
name = "replaces-index-record"
version = "0.1.0"
edition = "2024"
description = "Adds replacements to refs/notes/replaces and writes it in its canonical form"
license = "AGPL-3.0-only"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"
runner = { package = "replaces-index-runner", path = "../runner" }

[dev-dependencies]
insta = "1"
tempfile = "3"
